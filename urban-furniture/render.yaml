databases:
  - name: urban-furniture-db
    databaseName: urban_furniture_db
    user: urban_furniture_user
    plan: free

services:
  # -------------------------------------------------------------
  # BACKEND API (Node.js Express + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: urban-furniture-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urban-furniture-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 3
      - key: ADMIN_EMAIL
        value: admin123@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin123-
      - key: ADMIN_NAME
        value: Admin
      - key: FRONTEND_URL
        fromService:
          type: web
          name: urban-furniture-frontend
          property: host

  # -------------------------------------------------------------
  # FRONTEND (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: urban-furniture-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: urban-furniture-backend
          property: host
